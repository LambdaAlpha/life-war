[package]
name = "life-war-web"
version = "0.1.0"
edition = "2024"
description = "Local browser demo for Life War"

[lints]
workspace = true

[dependencies]
axum = "0.8"
life-war-core = { path = "../core", version = "0.1.0" }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
webbrowser = "1"
